<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<title>Aestus-parent</title>
<style>
/* 上から「いま何が要るか」順：ギフト → 今月の数字 → スタンプ → 調子の推移 → よく出た言葉 → 毎日の記録 */
:root {
  --bg: #f7f6f3; --card: #ffffff; --ink: #24272e; --muted: #6b7280; --line: #e6e4df;
  --accent: #d9667a; --accent-soft: #fbe7eb; --star: #e8798a; --sun: #e0a23a; --moon: #5b6bb5;
  --chart: #4f7cc4; --grid: #ebe9e4;
  --font: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171c; --card: #1e2128; --ink: #eceef2; --muted: #9aa2ae; --line: #2e323b;
    --accent: #f08a9b; --accent-soft: #3a2228; --star: #f08a9b; --sun: #f0b85a; --moon: #95a3e6; --chart: #7ea3e0; --grid: #2a2e36; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
header .who { margin-left: auto; font-size: 12px; color: var(--muted); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kids { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 520px) { .kids { flex-basis: 100%; } }
.kid { display: inline-flex; gap: 8px; align-items: baseline; }
.kid span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kid[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.kid[aria-pressed="true"] span { color: inherit; opacity: .9; }
select, button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 6px 12px; min-height: 36px; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.month { font-weight: 700; min-width: 7em; text-align: center; font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.gift { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 16px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.gift b { font-size: 16px; }
.gift button { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.gift.sent { background: var(--card); border-color: var(--line); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile .v { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .v small { font-size: 15px; color: var(--muted); font-weight: 600; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.meter { height: 8px; background: var(--grid); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--star); border-radius: 999px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.cal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cal .h { font-size: 12px; color: var(--muted); text-align: center; }
.cal .d { border-radius: 10px; background: var(--bg); min-height: 58px; padding: 4px 6px; font-size: 12px; color: var(--muted); position: relative; }
.cal .d.on { background: var(--accent-soft); color: var(--ink); }
.cal .d .star { position: absolute; right: 6px; top: 2px; color: var(--star); font-size: 18px; }
.cal .d .marks { position: absolute; left: 6px; bottom: 4px; font-size: 13px; letter-spacing: 2px; }
.cal .d.future { opacity: .45; }
.legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
.trend { display: grid; gap: 6px; }
.trend .row { display: grid; grid-template-columns: 3em minmax(0, 1fr); align-items: center; gap: 6px; }
.trend .row span { font-size: 13px; color: var(--muted); }
.trend svg { width: 100%; height: 56px; display: block; overflow: visible; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 6em minmax(0, 1fr) 2em; gap: 8px; align-items: center; font-size: 13px; }
.bar .t { height: 12px; background: var(--grid); border-radius: 999px; overflow: hidden; }
.bar .t i { display: block; height: 100%; background: var(--chart); border-radius: 0 4px 4px 0; }
.bar .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.days { display: grid; gap: 10px; }
.day { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.day .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.day .date { font-weight: 800; font-variant-numeric: tabular-nums; }
.pill { font-size: 12px; border-radius: 999px; padding: 1px 9px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.get { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }
.day .key { font-size: 15.5px; font-weight: 700; }
.day .meta { font-size: 13px; color: var(--muted); }
.day .treasure { font-size: 14.5px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs button { border-radius: 999px; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 700; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.muted { color: var(--muted); font-size: 12.5px; }
.flash { background: #e7f6ec; color: #1f6b3a; border-radius: 12px; padding: 10px 14px; margin: 0; font-weight: 700; }
@media (prefers-color-scheme: dark) { .flash { background: #1c3326; color: #8fdcaa; } }
.f { display: grid; gap: 4px; margin-bottom: 12px; min-width: 0; }
.f > span { font-size: 13px; font-weight: 700; }
.f small { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], textarea, select { font: inherit; width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 10px; }
textarea { resize: vertical; line-height: 1.5; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; min-height: 36px; margin-right: 16px; }
.row { display: flex; flex-wrap: wrap; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 12px; }
.kidrow { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(150px, 1.3fr) minmax(96px, .7fr) minmax(96px, .7fr) auto; gap: 0 12px; align-items: end; border-bottom: 1px solid var(--line); padding-top: 8px; }
@media (max-width: 560px) { .kidrow { grid-template-columns: 1fr 1fr; } .kidrow > label:nth-child(-n+2), .kidrow > .chk { grid-column: 1 / -1; } }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
.actions.sticky { position: sticky; bottom: 8px; margin: 0; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; padding: 6px 20px; }
.lines { display: grid; gap: 8px; }
.lrow { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; border-bottom: 1px solid var(--line); padding: 6px 0; }
.lrow button { margin-left: auto; }
.days5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.daycard h2 { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.daycard .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dc); }
.daycard { border-top: 4px solid var(--dc); }
.daycard[data-day="mon"] { --dc: #e0566a; } .daycard[data-day="tue"] { --dc: #3b8bd0; } .daycard[data-day="wed"] { --dc: #3f9f5c; }
.daycard[data-day="thu"] { --dc: #d99a1e; } .daycard[data-day="fri"] { --dc: #7b62c9; }
.day .extra { white-space: pre-line; }
.daycard textarea { min-height: 7.5em; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.err { color: #b42318; }
.foot { font-size: 12px; color: var(--muted); }
.foot a { color: inherit; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">読み込み中…</p></div>
<script>
(function () {
  "use strict";
  const app = document.getElementById("app");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const WD = { mon: "月", tue: "火", wed: "水", thu: "木", fri: "金" };
  let D = null;

  // ---------------------------------------------------------------- サーバー（見本のときは手元のデータ）
  const hasGas = typeof google !== "undefined" && google.script && google.script.run;
  function call(fn, ...args) {
    if (!hasGas) return Promise.resolve(window.SAMPLE ? window.SAMPLE(fn, ...args) : null);
    return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...args));
  }
  function load(ym, cid) {
    return call("getDashboard", ym, cid).then((d) => { D = d; render(); }).catch(showErr);
  }

  // ---------------------------------------------------------------- 計算
  const count = (rows, key) => {
    const m = {};
    rows.forEach((r) => String(r[key] || "").split("、").filter(Boolean).forEach((v) => (m[v] = (m[v] || 0) + 1)));
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };
  const wdOf = (d) => ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][new Date(d + "T12:00:00+09:00").getUTCDay()];
  const shiftYm = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };

  // ---------------------------------------------------------------- 部品
  function giftBox() {
    const s = D.stamps, m = Number(D.ym.slice(5));
    if (!s.achieved) return "";
    if (D.gift && D.gift.status === "贈呈済み")
      return `<div class="gift sent">🎁 <span>${m}月のごほうび（${esc(D.giftLabel)}）は <b>贈呈済み</b>（${esc(D.gift.sentAt)}）</span></div>`;
    return `<div class="gift">🎁 <span><b>${m}月のスタンプが全部そろいました（${s.count}/${s.goal}）</b><br>${esc(D.giftLabel)}のギフトを贈ったら押してください。本人の LINE に知らせます。</span>
      <button type="button" id="sent">贈った</button></div>`;
  }

  function tiles() {
    const s = D.stamps;
    const withResult = D.rows.filter((r) => r.quest_result);
    const got = withResult.filter((r) => /GET|別のもの/.test(r.quest_result)).length;
    return `<div class="tiles">
      <div class="card tile"><h2>${Number(D.ym.slice(5))}月のスタンプ</h2><div class="v">${s.count}<small> / ${s.goal}</small></div>
        <div class="meter" role="img" aria-label="${s.count} / ${s.goal}"><i style="width:${Math.min(100, (s.count / s.goal) * 100)}%"></i></div>
        <div class="s">${s.achieved ? "達成！" : `あと ${s.goal - s.count} 日`}（朝と夜の両方で1つ）</div></div>
      <div class="card tile"><h2>連続（夜まで書いた平日）</h2><div class="v">${D.streak}<small> 日</small></div><div class="s">土日は数えません</div></div>
      <div class="card tile"><h2>QUEST を見つけた</h2><div class="v">${got}<small> / ${withResult.length} 日</small></div><div class="s">「GET!」か「別のものを発見」</div></div>
    </div>`;
  }

  function calendar() {
    const on = new Set(D.stamps.stamped);
    const byDate = Object.fromEntries(D.rows.map((r) => [r.date, r]));
    const cells = [];
    D.stamps.days.forEach((d, i) => {
      const wd = wdOf(d);
      if (i === 0) for (let k = 0; k < ["mon", "tue", "wed", "thu", "fri"].indexOf(wd); k++) cells.push(`<div></div>`);
      const r = byDate[d] || {};
      const marks = (r.morning_at ? "☀" : "") + (r.night_at ? "🌙" : "");
      cells.push(`<div class="d${on.has(d) ? " on" : ""}${d > D.today ? " future" : ""}" title="${esc(d)}${marks ? "　" + (r.morning_at ? "朝あり " : "") + (r.night_at ? "夜あり" : "") : ""}">
        ${Number(d.slice(8))}${on.has(d) ? `<span class="star" aria-label="スタンプ">★</span>` : ""}<span class="marks">${marks}</span></div>`);
    });
    return `<div class="card"><h2>${Number(D.ym.slice(5))}月のスタンプカード</h2>
      <div class="cal">${["月", "火", "水", "木", "金"].map((w) => `<div class="h">${w}</div>`).join("")}${cells.join("")}</div>
      <div class="legend">★ スタンプ（朝と夜の両方）　☀ 朝を書いた　🌙 夜を書いた</div></div>`;
  }

  // 体・気分・元気を1本ずつ（同じ物差し 1〜5）。2本を1つの図に重ねない
  function trend() {
    const days = D.stamps.days.filter((d) => d <= D.today);
    if (!days.length) return "";
    const byDate = Object.fromEntries(D.rows.map((r) => [r.date, r]));
    const W = 600, H = 56, pad = 6;
    const x = (i) => pad + (days.length === 1 ? (W - 2 * pad) / 2 : (i * (W - 2 * pad)) / (days.length - 1));
    const y = (v) => H - pad - ((v - 1) / 4) * (H - 2 * pad);
    const line = (key, label) => {
      const pts = days.map((d, i) => ({ d, i, v: Number((byDate[d] || {})[key]) })).filter((p) => p.v >= 1);
      const path = pts.map((p, k) => (k ? "L" : "M") + x(p.i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
      const grid = [1, 3, 5].map((v) => `<line x1="${pad}" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`).join("");
      const dots = pts.map((p) => `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="4" fill="var(--chart)" stroke="var(--card)" stroke-width="2"><title>${p.d}（${WD[wdOf(p.d)]}）${label} ${p.v}</title></circle>`).join("");
      return `<div class="row"><span>${label}</span><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}の推移">${grid}
        <path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2" vector-effect="non-scaling-stroke"/>${dots}</svg></div>`;
    };
    return `<div class="card"><h2>今の俺をチェック（1〜5）の推移</h2><div class="trend">${line("body", "体")}${line("mood", "気分")}${line("energy", "元気")}</div>
      <div class="legend">線が切れている日は、朝を書いていない日です。数字に良い・悪いはありません</div></div>`;
  }

  function bars(title, entries) {
    if (!entries.length) return `<div class="card"><h2>${title}</h2><p class="empty">まだありません</p></div>`;
    const max = entries[0][1];
    return `<div class="card"><h2>${title}</h2><div class="bars">${entries.slice(0, 8).map(([k, n]) =>
      `<div class="bar"><span>${esc(k)}</span><div class="t"><i style="width:${(n / max) * 100}%"></i></div><span class="n">${n}</span></div>`).join("")}</div></div>`;
  }

  function days() {
    if (!D.rows.length) return `<div class="card"><h2>毎日の記録</h2><p class="empty">この月の記録はまだありません</p></div>`;
    return `<div class="card"><h2>毎日の記録（新しい順）</h2><div class="days">${D.rows.map((r) => `
      <article class="day">
        <div class="top"><span class="date">${Number(r.date.slice(5, 7))}/${Number(r.date.slice(8))}（${esc(r.weekday)}）</span>
          ${r.quest_result ? `<span class="pill${/GET|別のもの/.test(r.quest_result) ? " get" : ""}">${esc(r.quest_result)}</span>` : ""}
          ${r.win ? `<span class="pill">勝った？ ${esc(r.win)}</span>` : ""}
          ${r.morning_at ? "" : `<span class="pill">朝なし</span>`}${r.night_at ? "" : `<span class="pill">夜なし</span>`}</div>
        ${r.key ? `<div class="key">俺って、${esc(r.key)}かも。</div>` : ""}
        ${r.treasure ? `<div class="treasure">🏆 ${esc(r.treasure)}</div>` : ""}
        ${r.quest ? `<div class="meta">QUEST：${esc(r.quest)}${r.antenna ? `　アンテナ：${esc(r.antenna)}` : ""}</div>` : ""}
        ${r.body || r.mood || r.energy ? `<div class="meta">体 ${esc(r.body || "-")}・気分 ${esc(r.mood || "-")}・元気 ${esc(r.energy || "-")}${r.motto ? `　意気込み：${esc(r.motto)}` : ""}</div>` : ""}
        ${r.feelings ? `<div class="meta">今日あったもの：${esc(r.feelings)}</div>` : ""}
        ${r.extra ? `<div class="meta extra">${esc(r.extra)}</div>` : ""}
      </article>`).join("")}</div></div>`;
  }

  // ---------------------------------------------------------------- 画面の枠（タブ）
  // 記録を見る人と、設定を変える人は同じ親。タブで分け、設定は開いたときに読む
  const TABS = [["records", "記録"], ["kids", "子どもと LINE"], ["questions", "設問"], ["reward", "ごほうび"]];
  let TAB = "records", A = null;
  function shell(inner) {
    const viewer = (D && D.viewer) || (A && A.viewer) || "";
    app.innerHTML = `<header><h1>Aestus</h1>
        <nav class="tabs" role="tablist">${TABS.map(([k, t]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === TAB}">${t}</button>`).join("")}</nav>
        <span class="who">${esc(viewer)} で表示中</span></header>${inner}`;
    app.querySelectorAll("[data-tab]").forEach((b) => { b.onclick = () => openTab(b.dataset.tab); });
  }
  function openTab(tab) {
    TAB = tab;
    if (tab === "records") return D ? render() : load("", "");
    if (A) return renderAdmin();
    shell(`<p class="empty">読み込み中…</p>`);
    call("getAdmin").then((a) => { A = a; renderAdmin(); }).catch(showErr);
  }
  const showErr = (e) => shell(`<p class="err">開けませんでした：${esc(e.message || e)}</p>`);

  // ---------------------------------------------------------------- 記録タブ
  function render() {
    if (TAB !== "records") return;
    // 兄弟は並べて見せる。選んでいない子のスタンプ数と「🎁 未贈呈」もここで目に入る
    const kids = D.children.map((c) => `<button type="button" class="kid" data-cid="${esc(c.id)}" aria-pressed="${c.id === D.childId}">
      <b>${esc(c.name)}</b><span>${c.count}/${c.goal}${c.giftStatus === "未贈呈" ? " 🎁" : c.giftStatus === "贈呈済み" ? " ✓" : ""}</span></button>`).join("");
    if (!D.children.length) {
      shell(`<div class="card"><p class="empty">まだ子どもが登録されていません。「子どもと LINE」タブで名前を足してください。</p></div>`);
      return;
    }
    shell(`<div class="controls">
          ${D.children.length > 1 ? `<div class="kids" role="group" aria-label="誰の記録か">${kids}</div>` : `<b>${esc(D.children[0].name)}</b>`}
          <button type="button" id="prev" aria-label="前の月">‹</button><span class="month">${D.ym.slice(0, 4)}年${Number(D.ym.slice(5))}月</span>
          <button type="button" id="next" aria-label="次の月">›</button></div>
      ${giftBox()}${tiles()}
      <div class="two">${calendar()}${trend()}</div>
      <div class="two">${bars("よく選んだアンテナ", count(D.rows, "antenna"))}${bars("今日あったもの", count(D.rows, "feelings"))}</div>
      ${days()}
      <p class="foot">元のデータは <a href="${esc(D.sheetUrl)}" target="_blank" rel="noopener">スプレッドシート</a>（Excel が必要なら「ファイル → ダウンロード → Microsoft Excel」）</p>`);
    document.getElementById("prev").onclick = () => load(shiftYm(D.ym, -1), D.childId);
    document.getElementById("next").onclick = () => load(shiftYm(D.ym, 1), D.childId);
    app.querySelectorAll(".kid").forEach((b) => { b.onclick = () => { if (b.dataset.cid !== D.childId) load(D.ym, b.dataset.cid); }; });
    const sent = document.getElementById("sent");
    if (sent) sent.onclick = () => {
      if (!window.confirm || !window.confirm("ギフトを贈ったことにして、本人に知らせます。よろしいですか？")) return;
      sent.disabled = true; sent.textContent = "記録中…";
      call("markGiftSent", D.ym, D.childId).then((d) => { D = d; render(); })
        .catch((e) => { sent.disabled = false; sent.textContent = "贈った"; alert(e.message || e); });
    };
  }

  // ---------------------------------------------------------------- 管理タブ
  function renderAdmin() {
    if (TAB === "kids") return kidsTab();
    if (TAB === "questions") return questionsTab();
    if (TAB === "reward") return rewardTab();
  }
  /** 保存ボタンの共通処理。成功したら管理データを差し替えて描き直し、記録タブは次に開くとき読み直す */
  function save(btn, fn, args, done) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "保存中…";
    call(fn, ...args).then((a) => { A = a; D = null; renderAdmin(); flash(done); })
      .catch((e) => { btn.disabled = false; btn.textContent = label; alert(e.message || e); });
  }
  function flash(msg) {
    const el = document.getElementById("flash");
    if (el) { el.textContent = msg; el.hidden = false; }
  }
  const flashBox = `<p id="flash" class="flash" role="status" hidden></p>`;

  function kidsTab() {
    // 通知の時刻は 5:00〜23:45 を刻みごとに選ぶ。「通知しない」も選べる
    const times = [];
    for (let m = 5 * 60; m < 24 * 60; m += A.remindStep || 15) times.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
    const timeSel = (name, value, label) => `<label class="f"><span>${label}</span><select name="${name}">
        <option value="off"${value === "off" ? " selected" : ""}>通知しない</option>
        ${times.map((t) => `<option value="${t}"${t === value ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
    const row = (c, i) => `<div class="kidrow" data-i="${i}" data-id="${esc(c.id || "")}">
        <label class="f"><span>名前</span><input type="text" name="name" value="${esc(c.name)}" maxlength="20" placeholder="例：たかまさ"></label>
        <label class="f"><span>書くときの LINE</span><select name="line"><option value="">（まだつながない）</option>
          ${A.lines.map((l) => `<option value="${esc(l.id)}"${l.id === c.lineUserId ? " selected" : ""}>${esc(l.name || "（名前なし）")}${l.active ? "" : "（止めている）"}</option>`).join("")}</select></label>
        ${timeSel("morning", c.morningAt || A.defaultRemind.morning, "朝の通知")}
        ${timeSel("night", c.nightAt || A.defaultRemind.night, "夜の通知")}
        <label class="chk"><input type="checkbox" name="active"${c.active !== false ? " checked" : ""}> 使う</label>
      </div>`;
    const linked = (id) => A.children.filter((c) => c.lineUserId === id).map((c) => c.name);
    shell(`${flashBox}<div class="card"><h2>子ども</h2>
        <p class="note">名前は LINE のメッセージやセッションのカードに出ます。<b>兄弟で1つの LINE を使うなら、2人とも同じ LINE を選んでください。</b>入力ページの上に「RECORDING AS」（記録する人）が出て、切り替えて書けます。<br>
        使わなくなった子は「使う」を外します（記録は残ります。消す操作はありません）。<br>
        <b>通知</b>は平日だけ、その時刻までに書いていなければ届きます（15分ほど遅れることがあります）。兄弟で同じ LINE・同じ時刻なら1通にまとまります。</p>
        <div id="kidrows">${(A.children.length ? A.children : [{ name: "", active: true }]).map(row).join("")}</div>
        <div class="actions"><button type="button" id="addkid">＋ 子どもを足す</button><button type="button" class="primary" id="savekids">保存</button></div></div>
      <div class="card"><h2>友だち追加された LINE</h2>
        ${A.lines.length ? `<div class="lines">${A.lines.map((l) => `<div class="lrow"><b>${esc(l.name || "（名前なし）")}</b>
            <span class="muted">${esc(String(l.since || "").slice(0, 10))} 追加${linked(l.id).length ? "・" + linked(l.id).map(esc).join("、") + " が使う" : "・まだ誰ともつながっていない"}</span>
            <button type="button" data-line="${esc(l.id)}" data-active="${l.active}">${l.active ? "止める" : "再開する"}</button></div>`).join("")}</div>
          <p class="note">止めた LINE には声かけが届かず、入力ページも開けません（試しに友だち追加した親の LINE など）。</p>`
          : `<p class="empty">まだ誰も公式アカウントを友だち追加していません。友だち追加すると、ここに出てきます。</p>`}</div>`);
    document.getElementById("addkid").onclick = () => {
      const box = document.getElementById("kidrows");
      box.insertAdjacentHTML("beforeend", row({ name: "", active: true }, box.children.length));
      box.lastElementChild.querySelector("input").focus();
    };
    document.getElementById("savekids").onclick = (ev) => {
      const list = [...document.querySelectorAll(".kidrow")].map((r) => ({
        id: r.dataset.id || undefined, name: r.querySelector("[name=name]").value,
        lineUserId: r.querySelector("[name=line]").value, active: r.querySelector("[name=active]").checked,
        morningAt: r.querySelector("[name=morning]").value, nightAt: r.querySelector("[name=night]").value,
      }));
      save(ev.target, "saveChildren", [list], "保存しました。");
    };
    app.querySelectorAll("[data-line]").forEach((b) => {
      b.onclick = () => save(b, "setLineActive", [b.dataset.line, b.dataset.active !== "true"], "変えました。");
    });
  }

  // 設問の入力欄。name に「どこの値か」を書いておき、保存のときに同じ形に組み直す
  const tx = (path, label, value, hint) => `<label class="f"><span>${label}</span><input type="text" data-path="${path}" value="${esc(value)}">${hint ? `<small>${hint}</small>` : ""}</label>`;
  const ls = (path, label, list, hint) => `<label class="f"><span>${label}</span><textarea data-path="${path}" data-list rows="${Math.min(10, Math.max(3, list.length + 1))}">${esc(list.join("\n"))}</textarea><small>${hint || "1行に1つ"}</small></label>`;
  const bx = (path, label, on) => `<label class="chk"><input type="checkbox" data-path="${path}"${on ? " checked" : ""}> ${label}</label>`;

  function questionsTab() {
    const q = A.questions;
    const dayCard = (k) => {
      const d = q.days[k];
      return `<div class="card daycard" data-day="${k}"><h2><span class="dot"></span>${WD[k]}曜日</h2>
        ${tx(`days.${k}.name`, "名前", d.name)}${tx(`days.${k}.theme`, "テーマ", d.theme)}${tx(`days.${k}.question`, "問いかけ", d.question)}
        ${ls(`days.${k}.quests`, "QUEST の候補", d.quests, "1行に1つ。<b>空にすると</b>「" + esc(q.quest.before) + "＿" + esc(q.quest.after) + "」と自由に書く欄になります")}
        ${ls(`days.${k}.antenna`, "この曜日だけのアンテナ", d.antenna, "1行に1つ。<b>空なら共通のアンテナ</b>を使います")}
        ${ls(`days.${k}.extra_night`, "夜に足す質問", d.extra_night, "1行に1つ（5つまで）。例：今週の一番の宝物は？")}</div>`;
    };
    shell(`${flashBox}<div class="card"><h2>設問</h2>
        <p class="note">保存すると、<b>次に入力ページを開いたときから</b>変わります。今は${A.customized ? "<b>変更したもの</b>" : "シートどおり（初期値）"}を使っています。<br>
        すでに書いた記録は、そのとき選んだ言葉のまま残ります。</p></div>
      <div class="card"><h2>朝（共通）</h2>
        <div class="grid3">${q.condition.items.map((it, i) => tx(`condition.items.${i}.label`, `${i + 1}つ目の数字`, it.label) + tx(`condition.items.${i}.sub`, "ふりがな", it.sub)).join("")}</div>
        ${tx("antenna.label", "アンテナの見出し", q.antenna.label)}
        ${ls("antenna.options", "アンテナ（共通）", q.antenna.options)}
        <div class="row">${bx("antenna.multi", "アンテナを2つ以上選べる", q.antenna.multi)}${bx("antenna.own", "アンテナに「自分で決める」を出す", q.antenna.own)}</div>
        <div class="row">${bx("quest.own", "QUEST に「自分で決める」を出す", q.quest.own)}${bx("motto.enabled", "「今日の意気込み」を聞く", q.motto.enabled)}</div></div>
      <div class="card"><h2>夜（共通）</h2>
        ${ls("quest_result.options", "QUEST の結果", q.quest_result.options)}
        ${ls("feelings.options", "今日あったもの（いくつでも選べる）", q.feelings.options)}
        ${ls("win.options", "今日、自分に勝った？", q.win.options)}
        <div class="grid3">${tx("key.before", "発見の書き出し", q.key.before)}${tx("key.after", "発見の終わり", q.key.after)}</div></div>
      <div class="days5">${["mon", "tue", "wed", "thu", "fri"].map(dayCard).join("")}</div>
      <div class="card actions sticky"><button type="button" id="resetq">シートどおりに戻す</button><button type="button" class="primary" id="saveq">保存</button></div>`);
    document.getElementById("saveq").onclick = (ev) => save(ev.target, "saveQuestions", [collectQuestions()], "保存しました。次に入力ページを開いたときから変わります。");
    document.getElementById("resetq").onclick = (ev) => {
      if (!window.confirm || !window.confirm("設問をシートどおり（初期値）に戻します。よろしいですか？")) return;
      save(ev.target, "resetQuestions", [], "シートどおりに戻しました。");
    };
  }

  /** 画面の入力欄から、設問の形（今の設定をもとに上書き）を組み立てる。最終的な形はサーバーでそろえる */
  function collectQuestions() {
    const q = JSON.parse(JSON.stringify(A.questions));
    app.querySelectorAll("[data-path]").forEach((el) => {
      const keys = el.dataset.path.split(".");
      let o = q;
      keys.slice(0, -1).forEach((k) => { o = o[k]; });
      const last = keys[keys.length - 1];
      o[last] = el.type === "checkbox" ? el.checked
        : el.hasAttribute("data-list") ? el.value.split("\n").map((s) => s.trim()).filter(Boolean)
        : el.value;
    });
    return q;
  }

  function rewardTab() {
    shell(`${flashBox}<div class="card"><h2>ごほうび</h2>
      <p class="note">朝と夜の両方を書いた平日に ★ が1つ。目標に届くと、その子の LINE にお祝いが届き、「記録」タブに 🎁 が出ます。<br>
      <b>ギフトそのものは自動では贈れません。</b>LINE ギフトなどで贈ってから「贈った」を押してください。</p>
      <div class="grid3">
        <label class="f"><span>月の目標（★の数）</span><input type="number" id="goal" min="0" max="23" inputmode="numeric" value="${A.stampGoal || ""}" placeholder="空ならその月の平日の数"><small>空にすると、その月の平日の数（10月なら22）。祝日や行事が多い月に減らします</small></label>
        <label class="f"><span>ごほうびの言い方</span><input type="text" id="label" maxlength="30" value="${esc(A.giftLabel)}" placeholder="${esc(A.defaultGiftLabel)}"><small>メッセージに「○○のプレゼントを用意するね」と出ます</small></label>
      </div>
      <div class="actions"><button type="button" class="primary" id="saver">保存</button></div></div>`);
    document.getElementById("saver").onclick = (ev) => save(ev.target, "saveReward",
      [document.getElementById("goal").value, document.getElementById("label").value], "保存しました。");
  }

  load("", "");
})();
</script>
</body>
</html>
