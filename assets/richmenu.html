<!doctype html><meta charset="utf-8"><style>
/* トーク画面下のメニュー（2500×843）。入力ページの見出しと同じ：朝は暖色の空と太陽、夜は紺の空と月 */
body{margin:0;width:2500px;height:843px;display:grid;grid-template-columns:1fr 1fr;font-family:"Noto Sans CJK JP","Noto Sans JP","IPAPGothic",sans-serif;color:#f3f5f8}
div{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding-left:110px;gap:18px}
.m{background:linear-gradient(180deg,#0f0d0c 0%,#2a1a12 60%,#5a3018 100%)}
.n{background:linear-gradient(180deg,#05070d 0%,#0b1226 60%,#14204a 100%);border-left:4px solid #0a0c0f}
i{font-style:normal;font-size:52px;font-weight:900;letter-spacing:.08em;padding:6px 20px;border-radius:10px;align-self:flex-start}
.m i{background:#ffc46b;color:#1a1209}.n i{background:#e9eefc;color:#0b1226}
b{font-size:140px;white-space:nowrap;line-height:.95;font-weight:900;font-style:italic;letter-spacing:-.02em}
span{font-size:64px;font-weight:700;color:#c9ced8}
svg{position:absolute;right:0;bottom:0;width:640px;height:843px}
</style>
<div class="m"><svg viewBox="0 0 640 843"><defs><radialGradient id="g" cx="60%" cy="100%" r="70%"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff9a4d" stop-opacity=".6"/><stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/></radialGradient></defs><circle cx="420" cy="843" r="520" fill="url(#g)" opacity=".5"/><circle cx="420" cy="843" r="170" fill="#ffc46b"/></svg>
<i>AM</i><b>WARM-UP</b><span>朝・2〜3分</span></div>
<div class="n"><svg viewBox="0 0 640 843"><g fill="#fff"><circle cx="120" cy="140" r="5"/><circle cx="300" cy="260" r="4"/><circle cx="560" cy="120" r="5"/><circle cx="210" cy="520" r="3"/><circle cx="600" cy="640" r="4"/></g><path d="M500 560a90 90 0 1 0 80 140a74 74 0 1 1-80-140z" fill="#e9eefc"/></svg>
